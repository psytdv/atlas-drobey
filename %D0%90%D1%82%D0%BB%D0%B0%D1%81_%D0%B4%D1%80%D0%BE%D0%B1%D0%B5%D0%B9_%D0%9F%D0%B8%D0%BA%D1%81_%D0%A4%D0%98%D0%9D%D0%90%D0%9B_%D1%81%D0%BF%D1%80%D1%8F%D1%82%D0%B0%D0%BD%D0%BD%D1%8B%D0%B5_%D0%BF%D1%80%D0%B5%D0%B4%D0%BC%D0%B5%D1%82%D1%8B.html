<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Атлас дробей — шесть миров Пикса</title><style>
:root{--ink:#183c48;--teal:#167c8b;--gold:#ffcb64;--cream:#fff9e8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#103744;color:var(--ink)}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #ffb400}#app{min-height:100vh;background:radial-gradient(ellipse at top,#286e7b,#103744 75%);padding:16px}.shell{max-width:1030px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;flex-wrap:wrap}.brand{font-weight:900;font-size:clamp(19px,3vw,30px)}.pill{background:#ffffff24;padding:9px 13px;border-radius:30px}.panel{background:var(--cream);border:5px solid #f7d68a;border-radius:24px;padding:clamp(15px,3vw,28px);box-shadow:0 12px 0 #092e3c,0 20px 35px #0004;margin:18px auto}.hero{display:grid;grid-template-columns:1fr 220px;gap:12px;align-items:center}.robot{width:180px;max-width:100%;filter:drop-shadow(0 8px 3px #0002);animation:bob 2.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}h1{font-size:clamp(26px,4vw,46px);line-height:1.1;margin:10px 0}h2{margin:4px 0 12px;font-size:clamp(22px,3vw,32px)}p{line-height:1.5}.primary,.secondary{border-radius:15px;padding:12px 19px;font-weight:850;box-shadow:0 4px 0 #0003}.primary{background:#ffca5b;color:#563b11}.secondary{background:#d3eef0;color:#164955}.primary:hover,.secondary:hover,.choice:hover,.tile:hover{transform:translateY(-2px)}.muted{color:#58717a}.map{position:relative;background:linear-gradient(145deg,#5fc3c1,#278ca7);border:6px solid #c9e9d4;border-radius:22px;min-height:490px;overflow:hidden;padding:18px}.map:before{content:' ';position:absolute;inset:0;background:radial-gradient(ellipse at 25% 32%,#d7d38a 0 14%,transparent 14.4%),radial-gradient(ellipse at 75% 22%,#8fb77c 0 13%,transparent 13.4%),radial-gradient(ellipse at 48% 52%,#c9bb83 0 16%,transparent 16.4%),radial-gradient(ellipse at 79% 76%,#8b977c 0 14%,transparent 14.4%),radial-gradient(ellipse at 20% 80%,#d5ae7b 0 13%,transparent 13.4%);opacity:.75}.mapgrid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 15px;z-index:1}.island{min-height:165px;border:3px solid #ffffffb5;border-radius:50% 45% 48% 42%;background:#fff9dfdf;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;box-shadow:0 8px 0 #0002}.island .emoji{font-size:42px}.island:disabled{filter:grayscale(.8);opacity:.7;cursor:not-allowed}.island.done{background:#d6f7cc}.island strong{font-size:15px}.scene{position:relative;min-height:330px;border-radius:20px;background:linear-gradient(#b9e9f0,#d7edc7);border:4px solid #8bc6c2;overflow:hidden;padding:16px}.scene.forest{background:linear-gradient(#c6e8c9,#7dbf9b)}.scene.bridge{background:linear-gradient(#c0e6f0 45%,#51acc6 46%)}.scene.cave{background:linear-gradient(#a4c1c5,#667c90)}.scene.lava{background:linear-gradient(#d8b3a3,#e77b58)}.scene.temple{background:linear-gradient(#e4d8ac,#b3a46f)}.sceneTitle{text-align:center;font-weight:900;letter-spacing:1px}.theory{background:white;border:3px dashed #84b7b6;border-radius:18px;padding:17px;margin:12px 0}.viz{min-height:150px;background:#edf9f6;border-radius:16px;padding:16px;margin:12px 0}.fraction-grid{display:grid;grid-template-columns:repeat(4,1fr);max-width:320px;gap:5px;margin:15px auto}.cell{aspect-ratio:1;background:white;border:3px solid #75b3b2;border-radius:8px}.cell.on{background:#ffc86d}.options{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px 0}.choice{background:#fff;border:3px solid #85b7ba;border-radius:14px;padding:13px 19px;font-weight:800;min-width:95px}.choice.selected{background:#ffdf91;border-color:#c78b21}.feedback{padding:11px;border-radius:12px;background:#fff0c4;margin:12px 0;font-weight:650}.progress{height:14px;background:#d7e6e4;border-radius:20px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#55aa8c;transition:width .3s}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:600px;margin:20px auto}.tile{min-height:74px;background:#fff;border:3px solid #85b9b4;border-radius:12px;font-size:20px;font-weight:850}.tile.facedown{background:#4c8b9c;color:white}.tile.matched{background:#a6e7b7}.bridgeTiles{display:flex;gap:6px;justify-content:center;margin:20px auto;flex-wrap:wrap}.bridgeTile{width:65px;height:85px;background:#c9a36e;border:4px solid #806447;border-radius:8px;display:grid;place-items:center;font-size:27px}.bridgeTile.fixed{background:#d4f4bc}.gear{display:inline-grid;place-items:center;font-size:65px;animation:spin 10s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.lavaChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.lavaChoices button{background:linear-gradient(#ffe0a4,#ffb57e);border:4px solid #b96339;border-radius:20px;padding:20px 4px;font-weight:900}.lock{font-size:70px;text-align:center}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.step{border-radius:12px;background:#d7edeb;padding:9px 13px;font-weight:750}.step.active{background:#ffd57d}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}.small{font-size:14px}.stars{font-size:30px;letter-spacing:6px}.guide{display:flex;gap:12px;align-items:center}.guide svg{width:80px;flex-shrink:0}.hidden{display:none!important}@media(max-width:650px){.hero{grid-template-columns:1fr 110px}.robot{width:110px}.mapgrid{grid-template-columns:repeat(2,1fr)}.map{min-height:620px}.island{min-height:155px}.cards{gap:5px}.tile{font-size:16px;min-height:63px}.lavaChoices{grid-template-columns:1fr}.panel{border-width:3px}}

.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:.91em;min-width:1.25em;margin:0 .1em;font-weight:750}.frac>span:first-child{border-bottom:2px solid currentColor;width:100%;padding:0 .13em .09em;text-align:center}.frac>span:last-child{padding-top:.09em}.bonus-layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:14px;align-items:start}.treasure-scene{position:relative;width:100%;aspect-ratio:1410/928;background-size:100% 100%;background-repeat:no-repeat;border:5px solid #b88646;border-radius:17px;box-shadow:0 5px 0 #795a37;overflow:hidden}.secret{position:absolute;width:5%;height:8%;transform:translate(-50%,-50%);background:transparent;border:0;padding:0;z-index:2;cursor:crosshair;opacity:0}.secret:focus-visible{opacity:1;outline:2px dashed #fff8b0;border-radius:50%}.secret.discovered{pointer-events:none}@media(max-width:720px){.secret{width:8%;height:10%}}.treasure-aside{background:#f5e5bd;padding:12px;border:3px solid #c89e59;border-radius:14px}.treasure-aside h3{margin:0 0 8px}.bonus-list{display:block;width:100%;padding:8px;text-align:left;margin:5px 0;background:#fff8e9;border:1px solid #d1b584;border-radius:8px}.bonus-list.found{background:#d3f1d5;color:#326d42;text-decoration:line-through}.bonus-progress{height:10px;background:#e0ceb2;border-radius:9px;overflow:hidden}.bonus-progress div{height:100%;background:#55b48a}@media(max-width:720px){.bonus-layout{grid-template-columns:1fr}.treasure-aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.treasure-aside h3,.treasure-aside .bonus-progress,.treasure-aside p{grid-column:1/-1}.secret{width:5.5%}}
</style></head><body><div id="app"><div class="shell"><header class="top"><div class="brand">🧭 АТЛАС ДРОБЕЙ</div><div class="pill" id="hud">⏱️ 00:00 · ⭐ 0</div></header><main id="screen"></main></div></div><script>
const LEVELS=[["Остров долей", "Мозаика маяка", "Собери витраж: нажимай клетки, чтобы закрасить нужную долю.", "mosaic"], ["Лес равенства", "Тайные символы", "Найди пары равных дробей, чтобы открыть лесные ворота.", "pairs"], ["Разрушенный мост", "Переправа", "Выбери правильную плиту для каждого пролёта моста.", "bridge"], ["Механическая пещера", "Шестерёнки", "Вращай механизмы: вычисляй произведения и активируй двигатель.", "gears"], ["Огненный вулкан", "Лавовые каналы", "Направь лаву по верному каналу, решая деление дробей.", "lava"], ["Храм сокровищ", "Шифр храма", "Расшифруй код сейфа, решая смешанные задачи.", "vault"]], QUESTIONS=[[["Закрась 3/8 витража.", [], 0, "Числитель 3 — закрашиваем три части из восьми."], ["Закрась 5/8 витража.", [], 0, "Пять частей из восьми."], ["Закрась 1/4 витража.", [], 0, "Одна из четырёх равных частей."], ["Закрась 3/4 витража.", [], 0, "Три из четырёх частей."], ["Закрась 2/6 витража.", [], 0, "Две из шести частей."]], [["Найди все пары равных дробей.", [], 0, "Умножение или деление числителя и знаменателя на одно число сохраняет дробь."]], [["1/4 + 2/4 = ?", ["3/4", "3/8", "2/4"], 0, "При одинаковых знаменателях складываем числители."], ["5/6 − 1/6 = ?", ["4/6", "4/0", "5/6"], 0, "Вычитаем числители, знаменатель сохраняем."], ["1/2 + 1/4 = ?", ["3/4", "2/6", "1/6"], 0, "1/2 = 2/4, значит 2/4 + 1/4 = 3/4."], ["3/4 − 1/2 = ?", ["1/4", "2/2", "1/2"], 0, "1/2 = 2/4, значит 3/4 − 2/4 = 1/4."], ["2/3 + 1/6 = ?", ["5/6", "3/9", "1/2"], 0, "2/3 = 4/6, 4/6 + 1/6 = 5/6."]], [["2/3 × 3/4 = ?", ["1/2", "5/7", "6/7"], 0, "6/12 = 1/2."], ["1/2 × 2/5 = ?", ["1/5", "3/7", "2/5"], 0, "2/10 = 1/5."], ["3/5 × 5/6 = ?", ["1/2", "8/11", "3/6"], 0, "15/30 = 1/2."], ["2/7 × 7/8 = ?", ["1/4", "9/15", "2/8"], 0, "14/56 = 1/4."], ["3/4 от 20 = ?", ["15", "12", "16"], 0, "20 : 4 × 3 = 15."]], [["1/2 ÷ 1/4 = ?", ["2", "1/8", "1/2"], 0, "1/2 × 4/1 = 2."], ["3/4 ÷ 3/8 = ?", ["2", "9/32", "1/2"], 0, "3/4 × 8/3 = 2."], ["2/3 ÷ 4/5 = ?", ["5/6", "8/15", "6/5"], 0, "2/3 × 5/4 = 10/12 = 5/6."], ["5/6 ÷ 5/12 = ?", ["2", "25/72", "1/2"], 0, "5/6 × 12/5 = 2."], ["3/5 ÷ 2 = ?", ["3/10", "6/5", "5/6"], 0, "3/5 × 1/2 = 3/10."]], [["1/2 + 1/4 × 2 = ?", ["1", "3/2", "3/4"], 0, "Сначала умножение: 1/4 × 2 = 1/2; сумма = 1."], ["(3/4 − 1/4) ÷ 1/4 = ?", ["2", "1/4", "1"], 0, "В скобках 1/2; 1/2 ÷ 1/4 = 2."], ["2/3 × 3/4 + 1/3 = ?", ["5/6", "3/2", "1/2"], 0, "Произведение = 1/2, затем 1/2 + 1/3 = 5/6."], ["1 − 2/5 = ?", ["3/5", "2/5", "1/5"], 0, "1 = 5/5; 5/5 − 2/5 = 3/5."], ["(1/2 + 1/4) ÷ 1/2 = ?", ["3/2", "9/16", "1"], 0, "В скобках 3/4; 3/4 ÷ 1/2 = 3/2."]]];
const robot=`<svg class="robot" viewBox="0 0 190 240" role="img" aria-label="Пикс — дружелюбный робот-мальчик в синей куртке"><ellipse cx="96" cy="226" rx="53" ry="9" fill="#000" opacity=".13"/><path d="M82 52 L82 28 Q94 15 106 28 L106 52" fill="none" stroke="#344f6c" stroke-width="9"/><circle cx="95" cy="21" r="11" fill="#ffc95b"/><rect x="28" y="52" width="135" height="108" rx="32" fill="#cce8ec" stroke="#2a5268" stroke-width="8"/><rect x="42" y="71" width="107" height="67" rx="21" fill="#244f68"/><ellipse cx="74" cy="103" rx="11" ry="16" fill="#8af5ec"/><ellipse cx="119" cy="103" rx="11" ry="16" fill="#8af5ec"/><path d="M83 122 Q96 133 109 122" fill="none" stroke="#8af5ec" stroke-width="5" stroke-linecap="round"/><rect x="49" y="153" width="94" height="63" rx="19" fill="#3c8ec3" stroke="#2a5268" stroke-width="7"/><path d="M75 165 L95 185 L115 165" fill="none" stroke="#ffe2a3" stroke-width="7"/><path d="M47 169 L19 191 M145 169 L173 191" stroke="#2a5268" stroke-width="14" stroke-linecap="round"/><path d="M73 215 L69 229 M120 215 L125 229" stroke="#2a5268" stroke-width="15" stroke-linecap="round"/><path d="M51 55 Q95 20 144 55" fill="none" stroke="#f3c25b" stroke-width="9"/></svg>`;
const screen=document.querySelector('#screen');let saved={};try{saved=JSON.parse(localStorage.getItem('atlas_pix_v4')||'{}')}catch(e){};let state={level:0,stage:'home',idx:0,score:saved.score||0,unlocked:saved.unlocked||0,start:Date.now(),mistakes:0,paint:[],pairOpen:[],pairDone:[],pairOrder:[],selected:null,step:0};function save(){localStorage.setItem('atlas_pix_v4',JSON.stringify({score:state.score,unlocked:state.unlocked}))}function el(s){screen.innerHTML=s;screen.querySelectorAll('[data-action]').forEach(x=>x.addEventListener('click',()=>actions[x.dataset.action](x.dataset.value)))}function hud(){let s=Math.floor((Date.now()-state.start)/1000);document.querySelector('#hud').textContent=`⏱️ ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')} · ⭐ ${state.score}`};setInterval(hud,1000);hud();function card(s){return `<section class="panel">${s}</section>`}function progress(){return `<div class="progress"><div style="width:${state.level===1?state.pairDone.length/8*100:state.idx/5*100}%"></div></div><p class="muted small">${state.level===1?`Найдено пар: ${state.pairDone.length/2} из 4`:`Испытание ${Math.min(state.idx+1,5)} из 5`}</p>`}function goHome(){state.stage='home';el(card(`<div class="hero"><div><div class="pill" style="display:inline-block;background:#d5efec">Приключение · математика · 35–45 минут</div><h1>Пикс и шесть миров дробей</h1><p>Робот-мальчик Пикс отправляется за шестью частями Атласа. Каждый мир — новая игра и новый способ разобраться в дробях.</p><button class="primary" data-action="map">🗺️ Открыть карту приключения</button><p class="muted small">Сложение, вычитание, умножение и деление дробей — материал для опережающего обучения или 5–6 класса.</p></div>${robot}</div>`))}function map(){state.stage='map';el(card(`<h1>🗺️ Карта шести миров</h1><p>Проходи миры по порядку. Теория и игра в каждом мире уникальны.</p><div class="map"><div class="mapgrid">${LEVELS.map((l,i)=>`<button class="island ${i<state.unlocked?'done':''}" data-action="enter" data-value="${i}" ${i>state.unlocked?'disabled':''}><span class="emoji">${['🏝️','🌲','🌉','⚙️','🌋','🏛️'][i]}</span><strong>${l[0]}</strong><span class="small">${i<state.unlocked?'✓ Пройдено':i===state.unlocked?'▶ Исследовать':'🔒 Закрыто'}</span></button>`).join('')}</div></div><div class="actions"><span>Собрано частей Атласа: ${state.unlocked}/6</span><button class="secondary" data-action="reset">Начать заново</button></div>`))}function enter(i){i=+i;if(i>state.unlocked)return;state.level=i;state.idx=0;state.stage='theory';state.paint=[];state.step=0;theory()}
function guide(msg){return `<div class="guide">${robot}<div><strong>Пикс подсказывает:</strong><p>${msg}</p></div></div>`}
function theory(){let i=state.level,l=LEVELS[i];let explanation=[`Дробь a/b означает a равных частей из b. <b>Числитель</b> сверху, <b>знаменатель</b> снизу.`,`Дроби равны, если их числители и знаменатели умножены или разделены на одно и то же ненулевое число. Например, 1/2 = 2/4.`,`С одинаковыми знаменателями складываем или вычитаем числители. С разными — сначала приводим к общему знаменателю.`,`При умножении дробей умножаем числители и знаменатели: (a/b) × (c/d) = ac/bd.`,`Чтобы разделить на дробь, умножь на обратную: (a/b) ÷ (c/d) = (a/b) × (d/c).`,`Сначала скобки, затем умножение и деление, потом сложение и вычитание.`][i];el(card(`<h2>📖 Теория: ${l[0]}</h2>${guide(explanation)}<div class="theory"><b>Попробуй сам — мини-лаборатория:</b><p>${['Раскрась ровно 3 из 8 частей.','Найди дробь, равную 2/3.','Собери 1/2 + 1/4 на числовой полосе.','Сколько клеток составляют 2/3 от 3/4 прямоугольника?','Выбери обратную дробь для 3/5.','Расположи действия в правильном порядке.'][i]}</p><div id="lab"></div><div id="labFeedback" class="feedback" aria-live="polite">Выполни задание, чтобы открыть экспедицию.</div></div><div class="actions"><button class="secondary" data-action="map">← Карта</button><button class="primary" id="launch" data-action="launch" disabled>🚀 Начать испытание</button></div>`));renderLab()}
function labDone(msg){document.querySelector('#labFeedback').textContent='✓ '+msg;document.querySelector('#launch').disabled=false}
function renderLab(){let i=state.level,lab=document.querySelector('#lab');if(i===0){lab.innerHTML=`<div class="fraction-grid">${Array.from({length:8},(_,k)=>`<button class="cell ${state.paint.includes(k)?'on':''}" data-lab="${k}" aria-label="Часть ${k+1}"></button>`).join('')}</div>`;lab.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>{let k=+b.dataset.lab;state.paint=state.paint.includes(k)?state.paint.filter(x=>x!==k):[...state.paint,k];renderLab();if(state.paint.length===3)labDone('Три из восьми — это 3/8!')})}else if(i===1||i===4){let opts=i===1?['3/5','4/6','2/6']:['5/3','3/5','8/5'];lab.innerHTML=`<div class="options">${opts.map((o,k)=>`<button class="choice" data-lab="${k}">${o}</button>`).join('')}</div>`;lab.querySelectorAll('button').forEach(b=>b.onclick=()=>{let ok=+b.dataset.lab===(i===1?1:0);document.querySelector('#labFeedback').textContent=ok?'✓ Верно!':'Попробуй ещё раз.';if(ok)labDone(i===1?'2/3 = 4/6.':'Обратная к 3/5 — 5/3.')})}else if(i===2){lab.innerHTML=`<div style="display:flex;max-width:480px;margin:20px auto;height:60px;border:3px solid #367a86;border-radius:12px;overflow:hidden">${Array.from({length:4},(_,k)=>`<button data-lab="${k}" style="flex:1;border-right:2px solid #367a86;background:${state.paint.includes(k)?'#ffd06d':'#fff'}"></button>`).join('')}</div><p class="small">1/2 + 1/4 = 2/4 + 1/4. Закрась результат.</p>`;lab.querySelectorAll('button').forEach(b=>b.onclick=()=>{let k=+b.dataset.lab;state.paint=state.paint.includes(k)?state.paint.filter(x=>x!==k):[...state.paint,k];renderLab();if(state.paint.length===3)labDone('3/4 — верно!')})}else if(i===3){lab.innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,55px);gap:4px;justify-content:center">${Array.from({length:12},(_,k)=>`<div style="height:50px;border:2px solid #609da3;background:${k%4<3&&Math.floor(k/4)<2?'#ffcf72':'#fff'}"></div>`).join('')}</div><div class="options">${['6/12','2/7','5/12'].map((v,k)=>`<button class="choice" data-lab="${k}">${v}</button>`).join('')}</div>`;lab.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.lab===0)labDone('6 из 12 клеток = 1/2.');else document.querySelector('#labFeedback').textContent='Посчитай пересечение: 2 строки по 3 клетки.'})}else{let order=['Скобки','Умножение и деление','Сложение и вычитание'];lab.innerHTML=`<div class="steps">${state.paint.map(k=>`<span class="step">${order[k]}</span>`).join('')}</div><div class="options">${order.map((v,k)=>`<button class="choice" data-lab="${k}" ${state.paint.includes(k)?'disabled':''}>${v}</button>`).join('')}</div>`;lab.querySelectorAll('button').forEach(b=>b.onclick=()=>{let k=+b.dataset.lab;if(k!==state.paint.length){document.querySelector('#labFeedback').textContent='Подумай: что выполняется раньше?';return}state.paint.push(k);renderLab();if(state.paint.length===3)labDone('Порядок действий восстановлен!')})}}
function launch(){state.stage='game';state.idx=0;state.pairOpen=[];state.pairDone=[];state.pairOrder=[];state.selected=null;game()}
function scene(extra=''){return `<div class="scene ${['','forest','bridge','cave','lava','temple'][state.level]}"><div class="sceneTitle">${LEVELS[state.level][1]}</div>${extra}</div>`}
function game(){let i=state.level,n=state.idx;let intro=`<h2>${['🧩','🌲','🌉','⚙️','🌋','🔐'][i]} ${LEVELS[i][1]}</h2><p>${LEVELS[i][2]}</p>${progress()}`;let content='';if(i===0){let [a,b]=QUESTIONS[0][n][0].match(/(\d+)\/(\d+)/).slice(1).map(Number);content=scene(`<p style="text-align:center;font-size:22px;font-weight:800">${QUESTIONS[0][n][0]}</p><div class="fraction-grid" style="grid-template-columns:repeat(${b===6?3:4},1fr)">${Array.from({length:b},(_,k)=>`<button class="cell ${state.paint.includes(k)?'on':''}" data-cell="${k}"></button>`).join('')}</div><p style="text-align:center">Выбрано: ${state.paint.length} из ${b}</p>`)+`<div class="actions"><button class="secondary" data-action="clear">Очистить</button><button class="primary" data-action="checkpaint">Проверить витраж</button></div>`}else if(i===1){if(!state.pairOrder.length){state.pairOrder=[0,1,2,3,4,5,6,7].sort(()=>Math.random()-.5)}let labels=['1/2','2/4','2/3','4/6','3/5','6/10','3/4','9/12'];content=scene(`<p style="text-align:center">Нажимай на закрытые карточки ✦, открывай дроби и находи четыре пары равных дробей.</p><div class="cards">${state.pairOrder.map((id,pos)=>`<button class="tile ${state.pairDone.includes(id)?'matched':state.pairOpen.includes(pos)?'':'facedown'}" data-pair="${pos}" ${state.pairDone.includes(id)?'disabled':''}>${state.pairDone.includes(id)||state.pairOpen.includes(pos)?labels[id]:'✦'}</button>`).join('')}</div><p style="text-align:center">Пар найдено: ${state.pairDone.length/2} из 4</p>`)}else if(i===2){let q=QUESTIONS[i][n];let order=[1,2,0];content=scene(`<div class="bridgeTiles">${Array.from({length:5},(_,k)=>`<div class="bridgeTile ${k<n?'fixed':''}">${k<n?'✓':k===n?'✦':'🔒'}</div>`).join('')}</div><h2 style="text-align:center">${q[0]}</h2><div class="options">${order.map(k=>`<button class="choice" data-answer="${k}">${q[1][k]}</button>`).join('')}</div>`)}else if(i===3){let q=QUESTIONS[i][n],order=[2,0,1];content=scene(`<div style="text-align:center"><span class="gear">⚙️</span><span class="gear" style="animation-direction:reverse">⚙️</span></div><h2 style="text-align:center">${q[0]}</h2><div class="options">${order.map(k=>`<button class="choice" data-answer="${k}">${q[1][k]}</button>`).join('')}</div><p style="text-align:center">Запущено механизмов: ${n}/5</p>`)}else if(i===4){let q=QUESTIONS[i][n],order=[1,0,2];content=scene(`<div style="font-size:65px;text-align:center">🌋</div><h2 style="text-align:center">${q[0]}</h2><div class="lavaChoices">${order.map(k=>`<button data-answer="${k}">🌊 Канал ${k+1}<br>${q[1][k]}</button>`).join('')}</div>`)}else{let q=QUESTIONS[i][n],order=[2,1,0];content=scene(`<div class="lock">${['🔒','🔐','🗝️','🔓','🏆'][n]}</div><p style="text-align:center">Код ${n+1} из 5</p><h2 style="text-align:center">${q[0]}</h2><div class="options">${order.map(k=>`<button class="choice" data-answer="${k}">${q[1][k]}</button>`).join('')}</div>`)}el(card(intro+content+`<div id="msg" aria-live="polite"></div><div class="actions"><button class="secondary" data-action="map">← Карта</button><span class="muted small">Ошибки не мешают пройти квест: пробуй снова.</span></div>`));screen.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{let k=+b.dataset.cell;state.paint=state.paint.includes(k)?state.paint.filter(x=>x!==k):[...state.paint,k];game()});screen.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));screen.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>pair(+b.dataset.pair))}
function msg(s){document.querySelector('#msg').innerHTML=`<div class="feedback">${s}</div>`}function advance(explanation){state.score+=10;save();el(card(`<div class="hero"><div><h1>⭐ Отлично!</h1><p>${explanation}</p><p>Получено 10 звёзд.</p><button class="primary" data-action="next">${state.idx===4?'Завершить мир →':'Следующее испытание →'}</button></div>${robot}</div>`))}function next(){state.idx++;state.paint=[];if(state.idx>=5){state.unlocked=Math.max(state.unlocked,state.level+1);state.score+=25;save();if(state.level===5){finish()}else{el(card(`<div class="hero"><div><h1>🏅 Мир пройден!</h1><p>Пикс получил часть Атласа и открыл следующую локацию. +25 звёзд!</p><button class="primary" data-action="map">🗺️ На карту</button></div>${robot}</div>`))}}else game()}function answer(k){let q=QUESTIONS[state.level][state.idx];if(k===q[2])advance(q[3]);else{state.mistakes++;msg('Пока не получилось. Подсказка: '+q[3])}}function checkpaint(){let q=QUESTIONS[0][state.idx],target=+q[0].match(/(\d+)\//)[1];if(state.paint.length===target)advance(q[3]);else msg(`Нужно закрасить ${target} частей. Сейчас: ${state.paint.length}.`)}function pair(pos){let id=state.pairOrder[pos];if(state.pairDone.includes(id)||state.pairOpen.includes(pos)||state.pairOpen.length>=2)return;state.pairOpen.push(pos);game();if(state.pairOpen.length===2){let [a,b]=state.pairOpen.map(k=>state.pairOrder[k]);let matched=Math.floor(a/2)===Math.floor(b/2);setTimeout(()=>{if(state.stage!=='game'||state.level!==1)return;if(matched)state.pairDone.push(a,b);state.pairOpen=[];if(state.pairDone.length===8){state.score+=50;save();el(card(`<h1>🌳 Лес разгадан!</h1><p>Все четыре пары найдены. Равные дроби могут выглядеть по-разному, но обозначают одну и ту же часть целого.</p><button class="primary" data-action="completepairs">Забрать часть Атласа →</button>`))}else game()},650)}}function completepairs(){state.unlocked=Math.max(state.unlocked,2);state.score+=25;save();el(card(`<h1>🏅 Мир пройден!</h1><p>Пикс нашёл лесные символы и получил часть Атласа.</p><button class="primary" data-action="map">На карту →</button>`))}function finish(){el(card(`<div class="hero"><div><h1>🏆 Атлас восстановлен!</h1><p>Пикс прошёл все шесть миров, а ты освоил(а) доли, равные дроби и четыре арифметических действия с дробями.</p><div class="stars">⭐⭐⭐⭐⭐⭐</div><p>Итоговый счёт: <b>${state.score} звёзд</b>.</p><button class="primary" onclick="window.print()">🖨️ Сохранить диплом (печать)</button> <button class="secondary" data-action="reset">Пройти снова</button></div>${robot}</div>`))}function reset(){if(!confirm('Удалить прогресс и начать заново?'))return;localStorage.removeItem('atlas_pix_v4');state.score=0;state.unlocked=0;goHome()}const actions={map,enter,launch,next,reset,clear:()=>{state.paint=[];game()},checkpaint,completepairs};

let bonusFound=new Set();
function bonus(){
  state.stage='bonus';
  const list=BONUS_ITEMS.map((it,i)=>`<button class="bonus-list ${bonusFound.has(i)?'found':''}" data-focus="${i}">${bonusFound.has(i)?'✓':'◇'} ${it.name}</button>`).join('');
  const hidden=BONUS_ITEMS.map((it,i)=>`<button type="button" class="secret ${bonusFound.has(i)?'discovered':''}" style="left:${it.x}%;top:${it.y}%" data-secret="${i}" aria-label="Спрятанный предмет: ${it.name}" title="Исследовать предмет"></button>`).join('');
  el(card(`<h1>🎁 Секретная награда: Затерянные сокровища!</h1><p>Ты восстановил Атлас! Теперь найди <b>10 предметов</b>, замаскированных в джунглях. Приближай изображение пальцами или используй увеличение браузера. Найденные предметы отмечаются в списке справа.</p><div class="bonus-layout"><div class="treasure-scene" style="background-image:url('${BONUS_BG}')">${hidden}</div><aside class="treasure-aside"><h3>🔎 Найдено: ${bonusFound.size}/10</h3><div class="bonus-progress"><div style="width:${bonusFound.size*10}%"></div></div>${list}<p class="small">Подсказка: предметы нарисованы внутри пейзажа: ищи среди ветвей, камней и старинных вещей.</p></aside></div><div id="bonus-note" class="feedback" aria-live="polite">Исследуй рисунок. Все десять предметов уже нарисованы внутри пейзажа — нажимай непосредственно на них.</div><div class="actions"><button class="secondary" data-action="map">← Карта</button><button class="secondary" data-action="bonusreset">Начать поиск заново</button></div>`));
  screen.querySelectorAll('[data-secret]').forEach(b=>b.addEventListener('click',()=>{
    const id=+b.dataset.secret;if(bonusFound.has(id))return;bonusFound.add(id);save();
    if(bonusFound.size===10){bonusWin();return}bonus();
    document.getElementById('bonus-note').textContent='✨ Найден предмет: '+BONUS_ITEMS[id].name+'!';
  }));
  screen.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const id=+b.dataset.focus;const note=document.getElementById('bonus-note');note.textContent=bonusFound.has(id)?'Этот предмет уже найден.':'Ищи '+BONUS_ITEMS[id].name.toLowerCase()+' на картинке. Силуэт может сливаться с окружением.'});

function bonusWin(){state.bonusComplete=true;save();el(card(`<div class="hero"><div><h1>🏆 Секрет экспедиции раскрыт!</h1><p>Ты нашёл все десять предметов и получил звание <b>Мастера дробей и исследователя Атласа</b>!</p><p>⭐ Звёзд: ${state.score} · 🔎 Найдено: 10/10</p><button class="primary" data-action="bonus">Посмотреть сокровища ещё раз</button> <button class="secondary" onclick="window.print()">🖨️ Распечатать награду</button></div>${robot}</div>`))}
// Новая награда доступна после шести миров.
finish=function(){el(card(`<div class="hero"><div><h1>🏆 Атлас восстановлен!</h1><p>Пикс открыл секретный портал в джунгли. Тебя ждёт настоящая игра «Найди 10 предметов»!</p><div class="stars">⭐⭐⭐⭐⭐⭐</div><p>⭐ ${state.score} звёзд</p><button class="primary" data-action="bonus">🎁 Открыть секретную игру</button></div>${robot}</div>`))};
actions.bonus=bonus;
actions.bonusreset=()=>{bonusFound=new Set();bonus()};
// Вертикальная запись всех обыкновенных дробей в задачах, вариантах и теории.
const fractionRE=/(?<![\d\w])([0-9]{1,3})\s*\/\s*([0-9]{1,3})(?![\d\w])/g;
function fractionize(root){
 if(!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){if(node.parentElement?.closest('script,style,svg,.frac'))continue;
  const value=node.nodeValue;if(!/\d\s*\/\s*\d/.test(value))continue;
  const fragment=document.createDocumentFragment();let prev=0,m;fractionRE.lastIndex=0;
  while((m=fractionRE.exec(value))){fragment.append(document.createTextNode(value.slice(prev,m.index)));
   const span=document.createElement('span');span.className='frac';span.setAttribute('aria-label',m[1]+' '+m[2]);
   const a=document.createElement('span'),b=document.createElement('span');a.textContent=m[1];b.textContent=m[2];span.append(a,b);fragment.append(span);prev=m.index+m[0].length;
  }fragment.append(document.createTextNode(value.slice(prev)));node.replaceWith(fragment);
 }
}
const observer=new MutationObserver(()=>{observer.disconnect();fractionize(screen);observer.observe(screen,{childList:true,subtree:true})});
observer.observe(screen,{childList:true,subtree:true});

goHome();
